[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "techdigest"
version = "0.1.0"
description = "Pipeline diário de curadoria de notícias de tecnologia e politica brasileira com IA"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "trafilatura>=1.8",
    "edge-tts>=6.1",
    "aiohttp>=3.8",           # o tts.py importa direto; o mínimo é o que o edge-tts 7.3.1 pede
    "pydantic-settings>=2.0",
    "ollama>=0.3",
    "requests>=2.32",
    "openai>=1.40",
    "googlenewsdecoder>=0.1.6",
    "selectolax>=0.4.12,<1",  # selectolax 1.0 removeu o backend que o googlenewsdecoder usa
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.4", "pyright[nodejs]==1.1.414"]   # o [nodejs] traz o node num wheel

[project.scripts]
techdigest = "techdigest.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff.lint]
select = ["F", "ISC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ISC004"]     # textos longos partidos de propósito
"scripts/**" = ["ISC004"]   # textos longos partidos de propósito

[tool.pyright]
include = ["src", "scripts"]   # os testes ficam fora
typeCheckingMode = "basic"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"